spring:
  datasource:
    hikari:
      maximum-pool-size: ${TRADECORE_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${TRADECORE_DB_POOL_MIN_IDLE:2}
  jpa:
    show-sql: false
  lifecycle:
    timeout-per-shutdown-phase: ${TRADECORE_SHUTDOWN_TIMEOUT:30s}
  data:
    redis:
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:true}
server:
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
logging:
  level:
    root: INFO
    com.tradecore: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.flywaydb.core: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [requestId=%X{requestId:-}] %logger{36} - %msg%n"
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    metrics:
      access: unrestricted
tradecore:
  cors:
    allowed-origins: ${TRADECORE_CORS_ALLOWED_ORIGINS}
  websocket:
    allowed-origins: ${TRADECORE_WEBSOCKET_ALLOWED_ORIGINS}
  security:
    dev-user-enabled: false
    trusted-proxy-cidrs: ${TRADECORE_SECURITY_TRUSTED_PROXY_CIDRS:}
