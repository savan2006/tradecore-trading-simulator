spring:
  application:
    name: tradecore-backend
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      data-source-properties:
        sslmode: require
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      username: ${SPRING_DATA_REDIS_USERNAME:default}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: when-authorized
      show-details: when-authorized
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  health:
    defaults:
      enabled: true
tradecore:
  security:
    user: ${TRADECORE_SECURITY_USER:tradecore-dev}
    password: ${TRADECORE_SECURITY_PASSWORD}
  market-data:
    nse-mcp:
      market-live-endpoint: ${TRADECORE_NSE_MCP_MARKET_LIVE_ENDPOINT:https://mcp.nseindia.in/cmmkt/mcp}
      bhavcopy-endpoint: ${TRADECORE_NSE_MCP_BHAVCOPY_ENDPOINT:https://mcp.nseindia.in/bhavcopy/cm/mcp}
      connect-timeout: ${TRADECORE_NSE_MCP_CONNECT_TIMEOUT:PT5S}
      request-timeout: ${TRADECORE_NSE_MCP_REQUEST_TIMEOUT:PT12S}
