spring:
  application:
    name: tradecore-backend
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      data-source-properties:
        sslmode: require
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}
      username: ${SPRING_DATA_REDIS_USERNAME:default}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
logging:
  level:
    com.zaxxer.hikari.pool.HikariPool: WARN
    io.modelcontextprotocol.client.LifecycleInitializer: WARN
    org.hibernate.orm.connections.pooling: WARN
    org.flywaydb.core.FlywayExecutor: WARN
    org.springframework.boot.actuate.data.redis.DataRedisReactiveHealthIndicator: OFF
    org.springframework.boot.data.redis.health.DataRedisReactiveHealthIndicator: OFF
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-components: never
      show-details: never
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  health:
    defaults:
      enabled: true
tradecore:
  cors:
    allowed-origins: ${TRADECORE_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  websocket:
    allowed-origins: ${TRADECORE_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    register:
      limit: ${TRADECORE_RATE_LIMIT_REGISTER_LIMIT:5}
      window: ${TRADECORE_RATE_LIMIT_REGISTER_WINDOW:PT1H}
    order:
      limit: ${TRADECORE_RATE_LIMIT_ORDER_LIMIT:20}
      window: ${TRADECORE_RATE_LIMIT_ORDER_WINDOW:PT1M}
    cancel:
      limit: ${TRADECORE_RATE_LIMIT_CANCEL_LIMIT:30}
      window: ${TRADECORE_RATE_LIMIT_CANCEL_WINDOW:PT1M}
    authentication-failure:
      limit: ${TRADECORE_RATE_LIMIT_AUTH_FAILURE_LIMIT:10}
      window: ${TRADECORE_RATE_LIMIT_AUTH_FAILURE_WINDOW:PT5M}
  execution:
    max-orders-per-run: ${TRADECORE_EXECUTION_MAX_ORDERS_PER_RUN:1000}
    scheduling:
      enabled: ${TRADECORE_EXECUTION_ENABLED:true}
      interval: ${TRADECORE_EXECUTION_INTERVAL:PT5S}
  intraday:
    square-off-minutes-before-close: ${TRADECORE_INTRADAY_SQUARE_OFF_MINUTES_BEFORE_CLOSE:10}
    square-off-check-interval: ${TRADECORE_INTRADAY_SQUARE_OFF_CHECK_INTERVAL:PT30S}
  security:
    user: ${TRADECORE_SECURITY_USER:tradecore-dev}
    password: ${TRADECORE_SECURITY_PASSWORD:}
    dev-user-enabled: ${TRADECORE_SECURITY_DEV_USER_ENABLED:true}
    trusted-proxy-cidrs: ${TRADECORE_SECURITY_TRUSTED_PROXY_CIDRS:}
  market-data:
    cache:
      quote-ttl: ${TRADECORE_MARKET_DATA_QUOTE_CACHE_TTL:PT15S}
      instrument-ttl: ${TRADECORE_MARKET_DATA_INSTRUMENT_CACHE_TTL:PT1H}
    scheduling:
      quote-enabled: ${TRADECORE_MARKET_DATA_QUOTE_REFRESH_ENABLED:true}
      quote-interval: ${TRADECORE_MARKET_DATA_QUOTE_REFRESH_INTERVAL:PT5M}
      candle-enabled: ${TRADECORE_MARKET_DATA_CANDLE_REFRESH_ENABLED:true}
      candle-cron: ${TRADECORE_MARKET_DATA_CANDLE_REFRESH_CRON:0 0 18 * * MON-FRI}
      timezone: ${TRADECORE_MARKET_DATA_TIMEZONE:Asia/Kolkata}
      regular-session-open: ${TRADECORE_MARKET_DATA_SESSION_OPEN:09:15}
      regular-session-close: ${TRADECORE_MARKET_DATA_SESSION_CLOSE:15:30}
    nse-mcp:
      market-live-endpoint: ${TRADECORE_NSE_MCP_MARKET_LIVE_ENDPOINT:https://mcp.nseindia.in/cmmkt/mcp}
      bhavcopy-endpoint: ${TRADECORE_NSE_MCP_BHAVCOPY_ENDPOINT:https://mcp.nseindia.in/bhavcopy/cm/mcp}
      connect-timeout: ${TRADECORE_NSE_MCP_CONNECT_TIMEOUT:PT5S}
      request-timeout: ${TRADECORE_NSE_MCP_REQUEST_TIMEOUT:PT12S}
